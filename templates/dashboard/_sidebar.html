<aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <div class="sidebar__brand">
        <div>
            <strong>{{ app_name }}</strong>
            <span>Monitoring SSH Brute Force</span>
        </div>
    </div>

    <nav class="sidebar__nav">
        <a class="nav-item{% if active_page == 'overview' %} is-active{% endif %}" href="{{ overview_url }}"
           {% if active_page == 'overview' %}aria-current="page"{% endif %}>
            <span class="nav-item__index">01</span><span>Overview</span>
        </a>
        <a class="nav-item{% if active_page == 'security' %} is-active{% endif %}" href="{{ url_for('security_feed') }}"
           {% if active_page == 'security' %}aria-current="page"{% endif %}>
            <span class="nav-item__index">02</span><span>Security Feed</span>
        </a>
    </nav>

    <div class="sidebar__footer">
        <div class="user-chip">
            <span class="user-chip__avatar">{{ username[0]|upper }}</span>
            <div>
                <strong>{{ username }}</strong>
                <span>Administrator</span>
            </div>
        </div>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button--ghost button--block" type="submit">Logout</button>
        </form>
    </div>
</aside>

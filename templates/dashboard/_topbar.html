<header class="topbar">
    <div class="topbar__left">
        <button class="icon-button" id="sidebar-toggle" type="button"
                aria-label="Buka navigasi" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="breadcrumb">
            <span>Monitoring</span>
            <span class="breadcrumb__sep">/</span>
            <strong>{{ page_name }}</strong>
        </div>
    </div>
    <div class="topbar__right">
        {% if vm_options is defined %}
        <div class="topbar__vm">
            <div class="select-wrap">
                <select class="select vm-select" id="vm-select" data-vm-select aria-label="Pilih virtual machine">
                    {% for vm in vm_options %}
                        <option value="{{ vm.id }}" {% if vm.id == default_vm %}selected{% endif %}>{{ vm.label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% endif %}
        <div class="connection" id="connection" data-connection="connecting">
            <span class="loader" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="connection-text" aria-live="polite"></span>
        </div>
        <div class="last-updated">
            <strong id="last-updated">—</strong>
        </div>
        <button class="button button--ghost" id="refresh-button" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor"
                      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Refresh
        </button>
    </div>
</header>
